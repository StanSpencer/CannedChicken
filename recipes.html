<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canned Chicken Recipes</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

<!-- Header -->
<header class="bg-orange-500 text-white p-6 text-center">
  <a href="https://cannedchicken.com" class="text-3xl font-bold">🍗 CannedChicken.com</a>
  <p class="mt-2">Easy & Delicious Canned Chicken Recipes</p>
</header>

<!-- Nav -->
<nav class="bg-white shadow p-4 flex justify-center gap-6 font-semibold">
  <a href="#">Home</a>
  <a href="#">Quick Meals</a>
  <a href="#">Healthy</a>
  <a href="#">Comfort Food</a>
</nav>

<!-- Container -->
<div class="max-w-6xl mx-auto p-4">

  <!-- Sale Banner -->
  <div class="bg-gradient-to-r from-orange-500 to-orange-400 text-white p-6 rounded-xl text-center mb-6">
    <h2 class="text-2xl font-bold">CannedChicken.com is For Sale</h2>
    <p class="mt-2">Premium food domain perfect for recipes, eCommerce, or a viral brand.</p>
    <a href="https://unstoppabledomains.com/d/cannedchicken.com" target="_blank" class="inline-block mt-4 bg-white text-orange-500 px-6 py-2 rounded font-bold">Buy This Domain</a>
  </div>

  <!-- Search -->
  <div class="flex max-w-xl mx-auto mb-6">
    <input id="search" type="text" placeholder="Search recipes..." class="flex-1 p-3 border rounded-l">
    <button onclick="searchRecipes()" class="bg-orange-500 text-white px-6 rounded-r">Search</button>
  </div>

  <!-- Grid -->
  <div id="grid" class="grid md:grid-cols-3 sm:grid-cols-2 gap-6"></div>

</div>

<!-- Footer -->
<footer class="bg-gray-800 text-white text-center p-6 mt-10">
  © 2026 CannedChicken.com
</footer>

<script>
const recipes = [
{title:"Chicken Salad",img:"https://source.unsplash.com/400x300/?chicken,salad",cat:"Healthy",desc:"Creamy chicken salad using canned chicken.",tags:["quick","lunch"]},
{title:"Chicken Alfredo",img:"https://source.unsplash.com/400x300/?chicken,pasta",cat:"Comfort",desc:"Rich pasta with canned chicken.",tags:["dinner"]},
{title:"Chicken Tacos",img:"https://source.unsplash.com/400x300/?chicken,tacos",cat:"Quick",desc:"Fast tacos packed with flavor.",tags:["mexican"]},
{title:"Chicken Soup",img:"https://source.unsplash.com/400x300/?chicken,soup",cat:"Healthy",desc:"Warm and comforting soup.",tags:["easy"]},
{title:"Buffalo Chicken Dip",img:"https://source.unsplash.com/400x300/?buffalo,chicken",cat:"Comfort",desc:"Spicy party dip.",tags:["party"]},
{title:"Chicken Wraps",img:"https://source.unsplash.com/400x300/?chicken,wrap",cat:"Quick",desc:"Easy grab-and-go wraps.",tags:["lunch"]}
];

function render(list){
  document.getElementById('grid').innerHTML = list.map(r=>`
    <div class="bg-white rounded-xl shadow overflow-hidden">
      <img src="${r.img}" class="w-full h-40 object-cover">
      <div class="p-4">
        <h3 class="font-bold text-lg">${r.title}</h3>
        <p class="text-sm text-gray-500">${r.cat}</p>
        <p class="mt-2 text-sm">${r.desc}</p>
        <div class="mt-2">${r.tags.map(t=>`<span class="text-xs bg-gray-200 px-2 py-1 mr-1 rounded">#${t}</span>`).join('')}</div>
      </div>
    </div>
  `).join('');
}

function searchRecipes(){
  const term = document.getElementById('search').value.toLowerCase();
  render(recipes.filter(r=>r.title.toLowerCase().includes(term)));
}

render(recipes);
</script>

</body>
</html>
